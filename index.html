<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание 105</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--mute:#6b7690;--line:#dde2ec;--acc:#1f3a8a;--now:#f2a900;--nowbg:#fff6dd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:#182036;--ink:#e8ecf6;--mute:#8d98b3;--line:#2a3452;--acc:#8fa8ff;--now:#f2b93b;--nowbg:#2b2612}}
:root[data-theme="dark"]{--bg:#0f1524;--card:#182036;--ink:#e8ecf6;--mute:#8d98b3;--line:#2a3452;--acc:#8fa8ff;--now:#f2b93b;--nowbg:#2b2612}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px;font-weight:700}
.sub{color:var(--mute);font-size:14px;margin-bottom:14px}
.now{background:var(--nowbg);border:1px solid var(--now);border-left-width:6px;border-radius:10px;padding:12px 14px;margin-bottom:14px}
.now b{font-size:17px}.now small{display:block;color:var(--mute)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{flex:1;min-width:48px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 0;font:500 15px Onest,system-ui,sans-serif;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs button.today{box-shadow:inset 0 -3px 0 var(--now)}
.lesson{display:grid;grid-template-columns:64px 1fr auto;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;align-items:center}
.lesson.cur{border-color:var(--now);background:var(--nowbg)}
.t{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;line-height:1.25}
.t span{display:block;color:var(--mute);font-weight:400}
.n{font-weight:500}.m{color:var(--mute);font-size:14px}
.x{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);text-align:center;padding:22px 0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.add,.dl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:14px}
.add h2,.dl h2{font-size:16px;margin:0 0 10px}
.row{display:flex;gap:8px;margin-bottom:8px}
input,select{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px;font:400 15px Onest,system-ui,sans-serif}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:500 15px Onest,system-ui,sans-serif;cursor:pointer;width:100%}
.d{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.d:first-of-type{border-top:0}
.left{font-weight:700;white-space:nowrap}.left.soon{color:#c0392b}
.hint{color:var(--mute);font-size:13px;margin-top:10px}
.bot{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:14px}
.bot h2{font-size:16px;margin:0 0 10px}
#log{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.msg{padding:8px 11px;border-radius:10px;max-width:88%;white-space:pre-line;font-size:15px}
.msg.me{align-self:flex-end;background:var(--acc);color:#fff}
.msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:5px 11px;font:400 14px Onest,system-ui,sans-serif;cursor:pointer}
.ask{display:flex;gap:8px}.ask .btn{width:auto}
</style>
</head>
<body>
<main>
  <h1>Группа 105</h1>
  <div class="sub" id="date"></div>
  <div class="now" id="now"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>

  <div class="bot">
    <h2>Ассистент</h2>
    <div id="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <div class="ask">
      <input id="q" placeholder="Спроси про пары или дедлайны" aria-label="Вопрос">
      <button class="btn" id="askBtn">Спросить</button>
    </div>
  </div>

  <div class="add">
    <h2>Добавить пару</h2>
    <div class="row"><input id="name" placeholder="Предмет, например Матанализ"></div>
    <div class="row"><input id="room" placeholder="Аудитория / преподаватель"></div>
    <div class="row">
      <select id="day"></select>
      <input id="from" type="time" value="09:00" aria-label="Начало">
      <input id="to" type="time" value="10:35" aria-label="Конец">
    </div>
    <button class="btn" id="addBtn">Добавить пару</button>
    <p class="hint">Расписание берётся с my.econ.msu.ru/cacs. Автоматически я его подтянуть не смог, поэтому внеси пары один раз, дальше всё сохранится в этом браузере.</p>
  </div>

  <div class="dl">
    <h2>Работы и дедлайны</h2>
    <div id="dls"></div>
    <div class="row" style="margin-top:10px">
      <input id="dname" placeholder="Например, Контрольная по линалу">
      <input id="ddate" type="date" aria-label="Дата">
    </div>
    <button class="btn" id="dBtn">Добавить дедлайн</button>
  </div>
</main>
<script>
const DAYS=["Пн","Вт","Ср","Чт","Пт","Сб"],FULL=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
let S={lessons:[],dl:[]};
try{const r=localStorage.getItem("tt105");if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem("tt105",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const mins=t=>{const[a,b]=t.split(":");return +a*60+ +b};
const todayIdx=()=>{const d=new Date().getDay();return d===0?6:d-1};
let sel=Math.min(todayIdx(),5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("day").innerHTML=FULL.map((d,i)=>`<option value="${i}">${d}</option>`).join("");
$("day").value=sel;

function renderTabs(){
  $("tabs").innerHTML=DAYS.map((d,i)=>`<button class="${i===sel?"on":""} ${i===todayIdx()?"today":""}" data-i="${i}">${d}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;$("day").value=sel;render()});
}
function isCur(l){
  if(+l.day!==todayIdx())return false;
  const n=new Date(),m=n.getHours()*60+n.getMinutes();
  return m>=mins(l.from)&&m<mins(l.to);
}
function renderList(){
  const ls=S.lessons.filter(l=>+l.day===sel).sort((a,b)=>mins(a.from)-mins(b.from));
  $("list").innerHTML=ls.length?ls.map(l=>`<div class="lesson ${isCur(l)?"cur":""}">
    <div class="t">${l.from}<span>${l.to}</span></div>
    <div><div class="n">${esc(l.name)}</div><div class="m">${esc(l.room||"")}</div></div>
    <button class="x" data-id="${l.id}" aria-label="Удалить пару">✕</button></div>`).join("")
    :`<div class="empty">На ${FULL[sel].toLowerCase()} пар нет. Добавь их ниже.</div>`;
  $("list").querySelectorAll(".x").forEach(b=>b.onclick=()=>{S.lessons=S.lessons.filter(l=>l.id!=b.dataset.id);save();render()});
}
function renderNow(){
  const n=new Date(),m=n.getHours()*60+n.getMinutes(),t=todayIdx();
  const td=S.lessons.filter(l=>+l.day===t).sort((a,b)=>mins(a.from)-mins(b.from));
  const cur=td.find(l=>m>=mins(l.from)&&m<mins(l.to));
  const nxt=td.find(l=>mins(l.from)>m);
  let h;
  if(cur)h=`<b>Сейчас: ${esc(cur.name)}</b><small>до ${cur.to}, осталось ${mins(cur.to)-m} мин${cur.room?" · "+esc(cur.room):""}</small>`;
  else if(nxt){const d=mins(nxt.from)-m;h=`<b>Дальше: ${esc(nxt.name)}</b><small>в ${nxt.from}, через ${d>=60?Math.floor(d/60)+" ч "+d%60+" мин":d+" мин"}${nxt.room?" · "+esc(nxt.room):""}</small>`}
  else h=`<b>${td.length?"Пары на сегодня закончились":"Сегодня пар нет"}</b><small>${S.lessons.length?"Выбери другой день ниже":"Сначала добавь свои пары"}</small>`;
  $("now").innerHTML=h;
}
function renderDl(){
  const today=new Date();today.setHours(0,0,0,0);
  const ds=[...S.dl].sort((a,b)=>a.date.localeCompare(b.date));
  $("dls").innerHTML=ds.length?ds.map(d=>{
    const days=Math.round((new Date(d.date)-today)/864e5);
    const txt=days<0?"прошло":days===0?"сегодня":days===1?"завтра":`через ${days} дн.`;
    return `<div class="d"><span>${esc(d.name)}<br><span class="m">${d.date.split("-").reverse().join(".")}</span></span>
    <span><span class="left ${days>=0&&days<=3?"soon":""}">${txt}</span> <button class="x" data-id="${d.id}" aria-label="Удалить">✕</button></span></div>`}).join("")
    :`<div class="m">Дедлайнов пока нет.</div>`;
  $("dls").querySelectorAll(".x").forEach(b=>b.onclick=()=>{S.dl=S.dl.filter(d=>d.id!=b.dataset.id);save();renderDl()});
}
function render(){
  $("date").textContent=new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
  renderTabs();renderList();renderNow();renderDl();
}
$("addBtn").onclick=()=>{
  const name=$("name").value.trim();
  if(!name||mins($("from").value)>=mins($("to").value)){$("name").focus();return}
  S.lessons.push({id:Date.now(),name,room:$("room").value.trim(),day:$("day").value,from:$("from").value,to:$("to").value});
  sel=+$("day").value;$("name").value="";$("room").value="";save();render();
};
$("dBtn").onclick=()=>{
  const name=$("dname").value.trim(),date=$("ddate").value;
  if(!name||!date)return;
  S.dl.push({id:Date.now(),name,date});$("dname").value="";$("ddate").value="";save();renderDl();
};
const fmt=l=>`${l.from}–${l.to}  ${l.name}${l.room?" ("+l.room+")":""}`;
const dayLs=i=>S.lessons.filter(l=>+l.day===i).sort((a,b)=>mins(a.from)-mins(b.from));
const dayText=i=>i>5?"Воскресенье: пар нет.":dayLs(i).length?FULL[i]+":\n"+dayLs(i).map(fmt).join("\n"):FULL[i]+": пар нет.";
function nextLesson(){
  const n=new Date(),m=n.getHours()*60+n.getMinutes(),t=todayIdx();
  for(let i=0;i<7;i++){const d=(t+i)%7,ls=dayLs(d).filter(l=>i>0||mins(l.from)>m);if(ls.length)return{l:ls[0],i,d}}
  return null;
}
function answer(raw){
  const q=raw.toLowerCase().replace(/ё/g,"е"),w=q.split(/[^а-я]+/),has=(...k)=>k.some(x=>q.includes(x));
  const n=new Date(),m=n.getHours()*60+n.getMinutes(),t=todayIdx();
  if(has("дедлайн","контрол","работ","экзамен","зачет","сдать")){
    const td=new Date();td.setHours(0,0,0,0);
    const up=S.dl.filter(d=>new Date(d.date)>=td).sort((a,b)=>a.date.localeCompare(b.date));
    if(!up.length)return "Ближайших дедлайнов нет. Добавь их в блоке «Работы и дедлайны».";
    return up.map(d=>{const k=Math.round((new Date(d.date)-td)/864e5);
      return `${d.name}: ${d.date.split("-").reverse().slice(0,2).join(".")}, ${k===0?"сегодня":k===1?"завтра":"через "+k+" дн."}`}).join("\n");
  }
  if(!S.lessons.length)return "В расписании пока пусто. Добавь пары в форме ниже, и я смогу отвечать.";
  if(has("сейчас","идет","идёт")){
    const c=dayLs(t).find(l=>m>=mins(l.from)&&m<mins(l.to));
    return c?`Сейчас: ${fmt(c)}. Осталось ${mins(c.to)-m} мин.`:"Сейчас пары нет.";
  }
  if(has("дальше","следующ","ближайш","потом")){
    const r=nextLesson();
    if(!r)return "Впереди пар не нашёл.";
    return `${r.i===0?"Дальше сегодня":r.i===1?"Следующая пара завтра":"Следующая пара, "+FULL[r.d].toLowerCase()}:\n${fmt(r.l)}`;
  }
  if(has("завтра"))return dayText((t+1)%7);
  if(has("недел")||w.includes("вся")||w.includes("все"))return [0,1,2,3,4,5].map(dayText).join("\n\n");
  const names=[["пн","понедельник"],["вт","вторник"],["ср","сред"],["чт","четверг"],["пт","пятниц"],["сб","суббот"]];
  const di=names.findIndex(([s,l])=>w.includes(s)||q.includes(l));
  if(di>=0)return dayText(di);
  if(has("сегодня","пары","расписан"))return dayText(t);
  return "Я умею отвечать про пары и дедлайны: «что сегодня?», «что дальше?», «завтра», «пятница», «вся неделя», «дедлайны».";
}
function say(text,who){const d=document.createElement("div");d.className="msg "+who;d.textContent=text;$("log").appendChild(d);$("log").scrollTop=$("log").scrollHeight}
function ask(text){text=text.trim();if(!text)return;say(text,"me");say(answer(text),"ai");$("q").value=""}
say("Привет! Спроси, что сегодня, что дальше или когда ближайший дедлайн.","ai");
$("chips").innerHTML=["Что сегодня?","Что дальше?","Завтра","Дедлайны","Вся неделя"].map(c=>`<button>${c}</button>`).join("");
$("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>ask(b.textContent));
$("askBtn").onclick=()=>ask($("q").value);
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")ask($("q").value)});
render();setInterval(renderNow,30000);
</script>
</body>
</html>
